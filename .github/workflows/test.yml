name: test

# Runs on every push/PR to master. Scoped deliberately to what's actually
# fair to run on a clean GitHub-hosted runner -- see "Portable vs. local
# infra" below before adding anything here.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  js-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # code/exec.js's BASE constant resolves as path.resolve(HOME,
      # 'jarvis-x') -- correct for the real deployment (the app genuinely
      # lives at ~/jarvis-x on the dev machine), but actions/checkout puts
      # the code at $GITHUB_WORKSPACE, not $HOME/jarvis-x, so BASE points
      # nowhere on a hosted runner ("ENOENT ... /home/runner/jarvis-x").
      # Symlinking is simpler and less fragile than overriding HOME for
      # the job (which would also affect npm/other tooling's own HOME use).
      - name: Symlink $HOME/jarvis-x -> checkout dir (matches exec.js's BASE)
        run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/jarvis-x"
      # Portable vs. local infra: jest-runner.js runs every code/test-*.js
      # indiscriminately, but several of them (test-kokoro.js, test-vision.js,
      # test-voice.js, test-voice-interaction.js, test-voice-router.js) call
      # real local Ollama/Piper/Kokoro binaries and downloaded model files
      # that don't exist on a clean runner -- they'd fail here every single
      # time through no fault of the code, which is worse than not running
      # CI at all (a perpetually-red badge nobody trusts). One more
      # (test-agent-data-integration.js) reaches CoinGecko over the network.
      # Run only the ones that are genuinely self-contained instead. A test
      # qualifies when its inputs are arguments rather than the environment:
      # test-watcher takes an injectable fetcher, test-paper-trading takes
      # prices, test-market-collect takes a fetcher, and the rest take rows
      # and paths. None of them opens a socket.
      #
      # test-paper-trading was left out when it was added and had been
      # untested by CI since -- a tested module CI never runs is the failure
      # this repo keeps correcting, so it is in the list now with the rest.
      - name: Run portable test suite (excludes voice/vision tests needing local Ollama/Piper/Kokoro)
        run: |
          for f in test-exec test-guard test-helper test-scheduler test-shell \
                   test-validate test-watcher test-paper-trading \
                   test-market-analyst test-market-collect test-trade-advisor \
                   test-market-brief test-supervisor; do
            echo "▶ code/$f.js"
            node "code/$f.js"
          done

  python-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      # Same portability rule as the JS job. These two files need only pytest
      # and the repo itself; the other Python tests here import fastapi or
      # reach a live backend and would be red on every run through no fault
      # of the code.
      - name: Run portable Python tests
        run: python -m pytest test_hermes_ask_timeout_and_log.py test_hermes_market_context.py -q

  model-gateway-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: packages/model-gateway
      - run: npm test
        working-directory: packages/model-gateway

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
