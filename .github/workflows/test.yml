name: test

# Runs on every push/PR to master. Scoped deliberately to what's actually
# fair to run on a clean GitHub-hosted runner -- see "Portable vs. local
# infra" below before adding anything here.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  js-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # code/exec.js's BASE constant resolves as path.resolve(HOME,
      # 'jarvis-x') -- correct for the real deployment (the app genuinely
      # lives at ~/jarvis-x on the dev machine), but actions/checkout puts
      # the code at $GITHUB_WORKSPACE, not $HOME/jarvis-x, so BASE points
      # nowhere on a hosted runner ("ENOENT ... /home/runner/jarvis-x").
      # Symlinking is simpler and less fragile than overriding HOME for
      # the job (which would also affect npm/other tooling's own HOME use).
      - name: Symlink $HOME/jarvis-x -> checkout dir (matches exec.js's BASE)
        run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/jarvis-x"
      # Portable vs. local infra: jest-runner.js runs every code/test-*.js
      # indiscriminately, but several of them (test-kokoro.js, test-vision.js,
      # test-voice.js, test-voice-interaction.js, test-voice-router.js) call
      # real local Ollama/Piper/Kokoro binaries and downloaded model files
      # that don't exist on a clean runner -- they'd fail here every single
      # time through no fault of the code, which is worse than not running
      # CI at all (a perpetually-red badge nobody trusts). One more
      # test-agent-data-integration.js USED to be excluded for reaching
      # CoinGecko. Rewritten 2026-09-07: four of its five cases never needed
      # the network (resolveQuery is pure keyword matching, and the unknown-
      # query path returns before the data layer is touched), so the live
      # round trip is now one case behind JX_NET and the other 13 run here.
      # Run only the ones that are genuinely self-contained instead. A test
      # qualifies when its inputs are arguments rather than the environment:
      # test-watcher takes an injectable fetcher, test-paper-trading takes
      # prices, test-market-collect takes a fetcher, and the rest take rows
      # and paths. None of them opens a socket.
      #
      # test-paper-trading was left out when it was added and had been
      # untested by CI since -- a tested module CI never runs is the failure
      # this repo keeps correcting, so it is in the list now with the rest.
      #
      # test-selfdebug covers the self-diagnosis reader. Offline by
      # construction: every case reads a temp log written for it, and the
      # module has no writer to reach the real one.
      #
      # test-lib covers lib.js's execute() -- the single dispatch point for
      # every agent action, which had no test at all until 2026-09-07. It is
      # offline: every write goes to a logs/ scratch path, and writes aimed at
      # the off-limits files pass those files' own bytes so a broken gate
      # cannot damage them (it did, once -- see REMAINING_WORK.md P0.4).
      #
      # test-data-layer was the same failure again, twice over: it was not in
      # this list, and it ended in `runTests().catch(console.error)` so it
      # exited 0 even when the module under test was gone entirely. Both are
      # fixed as of 2026-09-07 -- it now uses test-helper (non-zero exit on
      # failure) and passes { useMock: true } everywhere, so it opens no
      # socket regardless of whether ALPHAVANTAGE_API_KEY is set.
      # WHY THIS COLLECTS FAILURES INSTEAD OF LETTING -e ABORT.
      #
      # GitHub Actions runs `run:` steps as `bash -e`, so a failing `node`
      # inside this loop does fail the job -- verified 2026-09-07 by dropping
      # a deliberately failing test into the list: `bash -e` exited 1. So the
      # job was never falsely green.
      #
      # But -e aborts at the FIRST failure, so a run with three broken files
      # reports one and leaves the other two to be found on the next push.
      # This runs every file, then fails once with all of them named.
      #
      # It also does not depend on -e being on. That default is GitHub's, not
      # this file's, and a control this repo relies on should be visible in
      # the file that relies on it. Relatedly: running this script by hand
      # WITHOUT -e exits 0 even when a test fails, which is how a local
      # "verbatim CI run, exit 0" was cited as evidence it could not support.
      # The explicit exit below makes the script honest under plain `bash`
      # too.
      #
      # THE SUITES STILL EXCLUDED, and why — recorded 2026-09-09 because until
      # then seven were excluded with no reason written anywhere, which is how
      # code/weekly-sweep.js's orphan detector found them:
      #   test-kokoro, test-vision, test-voice, test-voice-interaction,
      #   test-voice-router  need local Piper/Kokoro/Ollama and real audio
      #
      #   test-voice-accents WAS in the line above and did not belong there --
      #   corrected 2026-09-24. It needs no model, binary or audio; it imported
      #   nothing at all. It is in the run above now. test-voice-full-system
      #   was corrected the same way and then DELETED on 2026-09-25 along with
      #   the orphan voice stack it covered (Ahmed's call -- see PLAN_5).
      #
      #   Both ALSO could not fail, the same `.catch(console.error)` line as
      #   test-data-layer and the two accessibility suites -- the third and
      #   fourth occurrence, and the comment recording the previous fix sat two
      #   lines above their names in this very list. Demonstrated before
      #   fixing: with a deliberately false assertion each still exited 0 while
      #   printing "ALL VOICE SYSTEM TESTS PASSED". test-voice-accents uses
      #   test-helper now and exits 1 on a failing assertion -- checked both
      #   directions.
      #
      #   A WRONG EXCLUSION REASON IS WORSE THAN NO REASON. "needs real audio"
      #   is unfalsifiable from the outside and nobody re-runs the check, so
      #   these two sat out of CI for weeks on a claim that was never true.
      #   code/weekly-sweep.js's orphan detector cannot catch that: naming a
      #   suite anywhere in this file, including in a wrong reason, counts as
      #   documented.
      #   test-list-models    talks to ollama on 127.0.0.1:11434
      #   test-live-data      shells out to scripts that reach live APIs
      #   test-net            is a GATE for network tests, not a suite at all —
      #                       misnamed test-*, like test-helper was
      # test-accessibility and test-full-accessibility were in that list and
      # should not have been: both are offline, need only i18next (declared),
      # and are now in the run above. Both ALSO could not fail until this
      # commit — they ended in `.catch(console.error)`, the same line test.yml
      # already documents in test-data-layer.js.
      #
      # test-content-pipeline covers code/content-pipeline.js -- content phase
      # 1's two human gates (PLAN_5 §6.2: Ahmed owns the idea and the
      # narrative, Jarvis owns everything downstream). Offline by
      # construction and then some: research, rendering and POSTING are
      # injected functions with no defaults, so there is no code path from
      # this suite to YouTube even if a test tried to take one. A test greps
      # the module for a socket and finds none.
      #
      # test-content-integration drives the four content modules as ONE story:
      # draft -> gate -> produce -> gate -> post. Each has its own green suite,
      # and none of those can see a gap BETWEEN them -- the bitemporal memory
      # stack had five green layer suites while no human-approved change could
      # ever be applied. This one found two real gaps on its first run: the
      # drafter returned `sources` that the pipeline had nowhere to put and the
      # CLI never showed, so the script gate asked a human to approve a claim he
      # could not check; and attach() accepted `undefined`, so a caller that
      # skipped a refusal's `ok` flag wrote a meaningless row instead of being
      # stopped.
      #
      # test-content-draft covers code/content-draft.js -- §6.2's research ->
      # outline -> script steps. Offline: `ask` and `research` are injected
      # with NO defaults, so the module calls no model and opens no socket, and
      # every `ask` in the suite is a lookup table.
      #
      # It REFUSES to draft while config/writing-voice.md carries its
      # <!-- UNFILLED --> marker, which it does on master and should keep doing
      # until Ahmed writes it. §6.2 rules "Your words, Jarvis assists" -- a
      # draft in a voice Jarvis invented would invert that ruling while looking
      # like it satisfied it. So a CI run where that suite passes is a run where
      # the refusal works, not one where drafting was exercised end to end.
      #
      # test-content-fidelity covers code/content-fidelity.js -- a PORT of
      # automation/phase-b/content_generator.py's check_numeric_fidelity(),
      # whose every rule documents a false positive that once made the enforcer
      # refuse to ship correct content (REMAINING_WORK.md P4, four confirmed
      # invention defects). Two copies of one rule in two languages drift, so
      # both are held to fixtures/numeric-fidelity-cases.json, generated FROM
      # the Python by scripts/gen-fidelity-fixture.py. BOTH SUITES MUST STAY IN
      # CI: the Python's side is in the portable-Python step below, and it is
      # only the pair running together that stops a Python change plus a
      # regenerated fixture from moving the goalposts past the port unnoticed.
      #
      # test-content-cli covers code/content-cli.js -- `jj content`, the
      # surface Ahmed operates the two gates through. Split from bin/jj the
      # same way status.js is: run() returns { text, exitCode } and never
      # touches the console or process.exit, so both are assertable. The
      # `interactive` flag is an ARGUMENT rather than a process.stdin.isTTY
      # read, which is what lets a test drive both answers -- a module that
      # reads the environment cannot be tested against both.
      #
      # test-memory-embed covers code/memory-embed.js, bitemporal memory's
      # layer 3. The layer needs an embedding model (`nomic-embed-text` via
      # ollama), which is exactly why it was the last layer built and was
      # recorded as blocked -- but the MODEL is an argument, like the clock and
      # the repairFn before it, so the layer is offline here for the same
      # reason the rest are. Every embedder in the suite is a plain function
      # over a lookup table, and `ollamaEmbedder` is exercised with an injected
      # fetchFn, so no socket opens and the run is identical with or without a
      # daemon. What still needs the Chromebook is the live round trip, not
      # this suite.
      #
      # test-process-content covers code/process-content.js -- the one caller
      # of the content pipeline that runs UNATTENDED (schedules.json, every 30
      # minutes), which makes it the one place a decorative gate is invisible
      # until something is published. It is in this list because the version it
      # replaced was not: that version switched on STATES.SCRIPT_APPROVED and
      # STATES.CUT_APPROVED, neither of which is a member of STATES, so the
      # scheduled task silently matched nothing on every run -- and it called
      # the distributor's post() DIRECTLY rather than pipeline.post(), which is
      # where the cut-gate re-check lives. Offline like the rest: the pipeline
      # handle, the render and the poster are all arguments, with no default
      # for either function, so there is no path from this suite to YouTube.
      #
      # test-trading-signals covers code/trading-signals.js, the consumer for
      # logs/trading-signals.jsonl -- which app.py's TradingView webhook wrote
      # and NOTHING read until 2026-09-25. Offline: the log path, the clock and
      # the config path are all arguments, so it never touches the machine's
      # real log. Two of its assertions are constitutional rather than
      # functional: the module must import no executor and reach no book (§III
      # gates every proposal on a human tap), and every ticker in its map must
      # resolve to one of config/trading.json's six (§IV forbids holding
      # anything else) -- a map entry pointing outside the six THROWS rather
      # than filtering a row, because that is the allowlist widening, not a
      # stray alert.
      #
      # test-content-render covers code/content-render.js, the bridge from the
      # JS content pipeline to automation/phase-b's MoviePy renderer. Offline
      # because `run` -- the spawn -- is injected in every test, so CI neither
      # starts a python nor needs moviepy or ffmpeg (bootstrap puts both in
      # venv-ai, which a hosted runner does not have). What it CANNOT prove is
      # the happy path against a real encoder; that needs one run on the
      # Chromebook, and the suite says so in its own header rather than
      # implying coverage it does not have. The refusal paths ARE verified
      # against the real python, which on a machine without moviepy returns
      # exactly the refusal the injected runner reproduces.
      #
      # test-openai-gateway covers code/openai-gateway.js, the OpenAI-compatible
      # endpoint on 127.0.0.1:8010 that StarNet uses to reach registry.js's
      # tiers. Offline: registry, fetch, clock, kill switch and log are all
      # arguments, and requests/responses are in-memory fakes, so no socket is
      # opened and no quota file is written. Its REGRESSION tests pin the four
      # ways app.py's /v1 fails StarNet while returning 200 (no SSE, headers
      # only after the answer, last user turn only, tools dropped). It reads
      # app.py -- never writes it -- to pin that both endpoints map tier names
      # identically. What it CANNOT prove is a live upstream: one real StarNet
      # run on the Chromebook closes that (docs/STARNET_GATEWAY.md).
      #
      # test-starnet-launcher covers scripts/starnet.sh, which installs and runs
      # StarNet itself on the Chromebook, wired to that gateway. Offline: every
      # run points STARNET_DIR, HOME and the workspace root at a temp dir, and
      # `start` is exercised only on its refusal path, so nothing is cloned,
      # installed or started. It pins the process-matching bug found while
      # building it (an unanchored pgrep made `stop` kill the terminal that ran
      # it) with a live decoy process, and the stale-lock rule with real dead
      # and live PIDs.
      #
      # test-status covers code/status.js, which is what `jj status` reports.
      # Offline like the rest: collect() takes its registry, its fetch, its
      # stop-file path and its log path as arguments, so nothing in it opens a
      # socket or reads the real ~/.jarvis-x/.env. It carries a
      # `process.exitCode = 1` fuse -- a hung await drains the event loop and
      # exits 0, printing no tally, which is a vacuous pass that reads as
      # green. As of 2026-09-09 EVERY suite in this list carries that fuse
      # except test-scheduler, which does not use test-helper and reports in
      # its own `8/8 passed` format. Demonstrated rather than assumed: with
      # the fuse, a run that never reaches finish() exits 1; without it, the
      # same run exits 0.
      - name: Run portable test suite (excludes voice/vision tests needing local Ollama/Piper/Kokoro)
        run: |
          failed=""
          for f in test-exec test-guard test-scheduler test-shell \
                   test-validate test-watcher test-paper-trading \
                   test-market-analyst test-market-collect test-trade-advisor \
                   test-market-brief test-supervisor test-stooq-provider \
                   test-eval-agent test-agent test-data-layer test-lib \
                   test-selfdebug test-agent-data-integration test-sweep \
                   test-status test-weekly-sweep test-memory-bitemporal \
                   test-gate test-trading-performance test-memory-policy \
                   test-memory-repair test-memory-sweep test-memory-inbox \
                   test-memory-integration test-trading-integration \
                   test-accessibility test-full-accessibility \
                   test-memory-embed test-content-pipeline \
                   test-content-cli test-content-fidelity \
                   test-content-draft test-content-integration \
                   test-process-content test-voice-accents \
                   test-trading-signals test-content-render \
                   test-openai-gateway test-starnet-launcher; do
            echo "▶ code/$f.js"
            node "code/$f.js" || failed="$failed $f"
          done
          if [ -n "$failed" ]; then
            echo ""
            echo "FAILED:$failed"
            exit 1
          fi
          echo ""
          echo "all suites passed"

      # THE SWEEP. The loop above reports a suite that FAILS. It cannot report
      # a suite that cannot fail -- and six of those have been found by hand in
      # this repo (test-data-layer, test-shell, test-guard,
      # test-agent-data-integration, test-helper, and a status.sh check that
      # grepped a string the file never writes). sweep.js reads THIS list and
      # fails the build when any suite in it cannot report an assertion count.
      #
      # test-helper.js was removed from the list above by that sweep's first
      # real run: it is the shared harness, a library, and it emitted 0 bytes
      # and 0 assertions while counting toward the suite total.
      # test-data-layer.js covers it with 28 assertions, so nothing lost cover.
      - name: Zero-assertion sweep (every listed suite must be able to fail)
        run: node code/sweep.js

  python-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest requests
      # Same portability rule as the JS job. These need only pytest, requests
      # and the repo itself; the other Python tests here import fastapi or
      # reach a live backend and would be red on every run through no fault
      # of the code.
      - name: Run portable Python tests
        run: python -m pytest test_hermes_ask_timeout_and_log.py test_hermes_market_context.py -q
      # automation/ had never been run by CI at all. Both fidelity suites are
      # offline by construction -- the numeric guard is pure, and both the
      # Ollama and the Gemini calls are injected or monkeypatched -- so the
      # only thing that kept them off the runner was that nobody added them.
      # rootdir differs (content_generator is imported as a top-level module),
      # hence the separate step.
      - name: Run portable content-pipeline tests
        working-directory: automation/phase-b
        run: python -m pytest test_content_generator_numeric_fidelity.py test_content_generator_semantic_fidelity.py -q

  model-gateway-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: packages/model-gateway
      - run: npm test
        working-directory: packages/model-gateway

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
