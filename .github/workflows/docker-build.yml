name: docker-build

# Builds the single-container image (see Dockerfile's top comment for why
# it's one container, not Ollama-as-a-sibling-service) and pushes it to
# GHCR. Manual dispatch only, not on every push -- this is a heavy build
# (the bootstrap/requirements-venv-ai.txt torch/transformers/spaCy/Coqui
# stack), and unlike test.yml's suite it isn't something worth running on
# every commit.
#
# Exists because local builds on the dev machine's Crostini container hit
# a real, reproducible disk ceiling during the pip-install layer's commit
# step (confirmed across 5 separate build attempts, two different starting
# disk levels) -- a GitHub-hosted runner has more headroom for exactly
# that one step. Pull the result with:
#   echo "$(gh auth token)" | docker login ghcr.io -u ahmedyidris --password-stdin
#   docker pull ghcr.io/ahmedyidris/jarvis-x:latest
on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Standard runners ship with several GB of preinstalled toolchains
      # (.NET, Android SDK, GHC, etc.) this build never touches -- freeing
      # them mirrors the same "free disk before building" lesson learned
      # locally, and this image is large enough (CPU torch + transformers +
      # spaCy + Coqui TTS) that it's worth the ~1 min this step costs.
      - name: Free unneeded preinstalled disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ahmedyidris/jarvis-x:latest
            ghcr.io/ahmedyidris/jarvis-x:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
