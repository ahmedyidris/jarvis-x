; Container adaptation of config/supervisord.conf -- same two programs
; (ollama, hermes-api), paths adjusted for the image's filesystem
; (WORKDIR /app, root's venv instead of /home/ahmedyidris/venv-ai).
; supervisord itself runs in the foreground as the container's PID 1 (via
; docker/entrypoint.sh), not as a background daemon.
[unix_http_server]
file=/tmp/jarvis-supervisor.sock

[supervisord]
nodaemon=true
logfile=/app/logs/supervisord/supervisord.log
pidfile=/tmp/jarvis-supervisord.pid
childlogdir=/app/logs/supervisord

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/jarvis-supervisor.sock

[program:ollama]
command=/usr/local/bin/ollama serve
autostart=true
autorestart=true
startretries=3
stdout_logfile=/app/logs/supervisord/ollama.out.log
stderr_logfile=/app/logs/supervisord/ollama.err.log
environment=HOME="/root",OLLAMA_MODELS="/root/.ollama/models"

[program:hermes-api]
; 0.0.0.0, not 127.0.0.1 like the bare-metal config: Docker's port mapping
; (docker-compose.yml's "8000:8000") can only forward to a process that
; listens on more than just the container's own loopback interface.
; Because this becomes reachable outside the container's network
; namespace, JARVIS_API_TOKEN (app.py's opt-in auth, off by default on
; bare metal) is worth actually turning on here -- see DEPLOY.md.
command=/root/venv-ai/bin/uvicorn app:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=3
stdout_logfile=/app/logs/supervisord/hermes-api.out.log
stderr_logfile=/app/logs/supervisord/hermes-api.err.log
