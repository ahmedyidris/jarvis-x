[unix_http_server]
file=/tmp/jarvis-supervisor.sock
chmod=0700

[supervisord]
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/jarvis-supervisor.sock

# DISABLED 2026-08-31: ollama now managed by systemd (/etc/systemd/system/ollama.service)
# with KEEP_ALIVE=30m. This stanza set KEEP_ALIVE=0, forcing a ~28s cold start on
# every request -- root cause of the "8-minute Arabic latency".
#
# FIXED 2026-09-01: the rename to _DISABLED alone did NOT actually disable this --
# autostart was still "true", so supervisord kept validating/launching it. Worse,
# supervisord validates every program's stdout/stderr log-file directory at its
# OWN startup, before any child (and its own mkdir -p) ever runs -- when
# logs/supervisord/ didn't exist, supervisord itself fatally failed startup
# validation and got stuck in an infinite respawn-crash loop, taking hermes-api
# and tts-worker down with it (real outage, not hypothetical -- see wiki_write).
# Now genuinely disabled (autostart=false) with logs going to /dev/null so this
# section can never again depend on a directory that might not exist.
[program:ollama_DISABLED]
command=/bin/bash -c "mkdir -p /home/ahmedyidris/jarvis-x/logs/supervisord && exec /usr/local/bin/ollama serve"
environment=HOME="/home/ahmedyidris",OLLAMA_MODELS="/usr/share/ollama/.ollama/models",OLLAMA_KEEP_ALIVE="0",OLLAMA_MAX_LOADED_MODELS="1"
autostart=false
autorestart=false
startretries=3
startsecs=5
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:tts-worker]
command=/bin/bash -c "mkdir -p /home/ahmedyidris/jarvis-x/logs/supervisord && exec /home/ahmedyidris/venv-ai/bin/python code/tts_worker.py"
directory=/home/ahmedyidris/jarvis-x
autostart=true
autorestart=true
startretries=3
startsecs=60
stopwaitsecs=30
environment=HOME="/home/ahmedyidris"
stdout_logfile=/home/ahmedyidris/jarvis-x/logs/supervisord/tts-worker.out.log
stderr_logfile=/home/ahmedyidris/jarvis-x/logs/supervisord/tts-worker.err.log

[program:hermes-api]
command=/bin/bash -c "mkdir -p /home/ahmedyidris/jarvis-x/logs/supervisord && exec /home/ahmedyidris/venv-ai/bin/uvicorn app:app --host 127.0.0.1 --port 8000"
directory=/home/ahmedyidris/jarvis-x
autostart=true
autorestart=true
startretries=3
startsecs=3
stdout_logfile=/home/ahmedyidris/jarvis-x/logs/supervisord/hermes-api.out.log
stderr_logfile=/home/ahmedyidris/jarvis-x/logs/supervisord/hermes-api.err.log
