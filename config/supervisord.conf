[unix_http_server]
file=/tmp/jarvis-supervisor.sock
chmod=0700

[supervisord]
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/jarvis-supervisor.sock

[program:ollama]
command=/usr/local/bin/ollama serve
environment=HOME="/home/ahmedyidris",OLLAMA_MODELS="/usr/share/ollama/.ollama/models"
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/home/ahmedyidris/jarvis-x/logs/supervisord/ollama.out.log
stderr_logfile=/home/ahmedyidris/jarvis-x/logs/supervisord/ollama.err.log

[program:tts-worker]
command=/home/ahmedyidris/venv-ai/bin/python code/tts_worker.py
directory=/home/ahmedyidris/jarvis-x
autostart=true
autorestart=true
startretries=3
startsecs=60
stopwaitsecs=30
environment=HOME="/home/ahmedyidris"
stdout_logfile=/home/ahmedyidris/jarvis-x/logs/supervisord/tts-worker.out.log
stderr_logfile=/home/ahmedyidris/jarvis-x/logs/supervisord/tts-worker.err.log

[program:hermes-api]
command=/bin/bash -c "mkdir -p /home/ahmedyidris/jarvis-x/logs/supervisord && exec /home/ahmedyidris/venv-ai/bin/uvicorn app:app --host 127.0.0.1 --port 8000"
directory=/home/ahmedyidris/jarvis-x
autostart=true
autorestart=true
startretries=3
startsecs=3
stdout_logfile=/home/ahmedyidris/jarvis-x/logs/supervisord/hermes-api.out.log
stderr_logfile=/home/ahmedyidris/jarvis-x/logs/supervisord/hermes-api.err.log
