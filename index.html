<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes — Local AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a2849 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .tagline {
            color: #888;
            font-size: 0.95em;
        }
        
        .card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 12px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-size: 0.9em;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        select, input[type="text"] {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(100, 116, 139, 0.4);
            color: #e0e0e0;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.95em;
            transition: all 0.2s;
        }
        
        select:hover, input[type="text"]:hover {
            border-color: rgba(100, 116, 139, 0.6);
        }
        
        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }
        
        #question {
            grid-column: 1 / -1;
            padding: 14px;
            font-size: 1em;
            min-height: 60px;
            resize: vertical;
            font-family: inherit;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3b82f6;
        }
        
        .checkbox-group label {
            margin: 0;
            cursor: pointer;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-ask {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }
        
        .btn-ask:hover {
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }
        
        .btn-ask:active {
            transform: translateY(0);
        }
        
        .btn-clear {
            background: rgba(100, 116, 139, 0.2);
            color: #cbd5e1;
            border: 1px solid rgba(100, 116, 139, 0.4);
        }
        
        .btn-clear:hover {
            background: rgba(100, 116, 139, 0.3);
        }
        
        .btn-ask:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #response {
            display: none;
        }
        
        #response.visible {
            display: block;
        }
        
        .response-content {
            margin-bottom: 20px;
        }
        
        .response-label {
            font-size: 0.85em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .response-text {
            color: #e0e0e0;
            line-height: 1.6;
            padding: 15px;
            background: rgba(15, 23, 42, 0.5);
            border-left: 3px solid #3b82f6;
            border-radius: 4px;
        }
        
        .audio-player {
            margin-top: 15px;
            padding: 12px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        
        audio {
            width: 100%;
            margin-top: 10px;
        }
        
        .meta {
            font-size: 0.85em;
            color: #888;
            margin-top: 15px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            color: #f87171;
            padding: 12px;
            background: rgba(248, 113, 113, 0.1);
            border-left: 3px solid #f87171;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        .success {
            color: #86efac;
            padding: 12px;
            background: rgba(134, 239, 172, 0.1);
            border-left: 3px solid #86efac;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 1.8em; }
            .controls { grid-template-columns: 1fr; }
            #question { grid-column: 1; }
            .button-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Hermes</h1>
            <p class="tagline">Local AI Assistant — v1</p>
        </header>
        
        <div class="card">
            <div class="controls">
                <textarea id="question" placeholder="Ask Hermes anything..." spellcheck="true"></textarea>
                
                <div class="control-group">
                    <label for="tier">Tier</label>
                    <select id="tier">
                        <option value="local">Local (Fast, 3B)</option>
                        <option value="quality">Quality (Natural, 7B)</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="voice">Voice</label>
                    <select id="voice"></select>
                </div>
                
                <div class="control-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="speak" />
                        <label for="speak">Synthesize audio</label>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn-ask" onclick="askHermes()">Ask Hermes</button>
                <button class="btn-clear" onclick="clearAll()">Clear</button>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #888;">Thinking...</p>
            </div>
            
            <div id="response">
                <div id="error"></div>
                <div class="response-content">
                    <div class="response-label">Response</div>
                    <div class="response-text" id="responseText"></div>
                </div>
                <div id="audioContainer"></div>
                <div class="meta">
                    <span id="metaTier"></span>
                    <span id="metaVoice"></span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api';
        
        async function loadVoices() {
            try {
                const res = await fetch(`${API_BASE}/voices`);
                const data = await res.json();
                const voiceSelect = document.getElementById('voice');
                voiceSelect.innerHTML = data.voices.map(v => 
                    `<option value="${v.id}">${v.name}</option>`
                ).join('');
            } catch (e) {
                console.error('Failed to load voices:', e);
            }
        }
        
        async function askHermes() {
            const question = document.getElementById('question').value.trim();
            const tier = document.getElementById('tier').value;
            const voice = document.getElementById('voice').value;
            const speak = document.getElementById('speak').checked;
            
            if (!question) {
                showError('Please enter a question');
                return;
            }
            
            showLoading(true);
            clearError();
            
            try {
                const res = await fetch(`${API_BASE}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, tier, voice, speak })
                });
                
                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.detail || 'Request failed');
                }
                
                const data = await res.json();
                displayResponse(data);
            } catch (e) {
                showError(`Error: ${e.message}`);
            } finally {
                showLoading(false);
            }
        }
        
        function displayResponse(data) {
            const response = document.getElementById('response');
            const responseText = document.getElementById('responseText');
            const audioContainer = document.getElementById('audioContainer');
            
            responseText.textContent = data.response;
            
            document.getElementById('metaTier').innerHTML = 
                `<strong>Tier:</strong> ${data.tier}`;
            document.getElementById('metaVoice').innerHTML = 
                `<strong>Voice:</strong> ${data.voice || 'text only'}`;
            
            audioContainer.innerHTML = '';
            if (data.audio) {
                audioContainer.innerHTML = `
                    <div class="audio-player">
                        <div class="response-label">Audio Response</div>
                        <audio controls>
                            <source src="${data.audio}" type="audio/wav">
                        </audio>
                    </div>
                `;
            }
            
            response.classList.add('visible');
            response.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        function showLoading(active) {
            document.getElementById('loading').classList.toggle('active', active);
        }
        
        function showError(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.innerHTML = `<div class="error">${msg}</div>`;
        }
        
        function clearError() {
            document.getElementById('error').innerHTML = '';
        }
        
        function clearAll() {
            document.getElementById('question').value = '';
            document.getElementById('response').classList.remove('visible');
            clearError();
        }
        
        // Initialize
        loadVoices();
        document.getElementById('question').focus();
    </script>
</body>
</html>
